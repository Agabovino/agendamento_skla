version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5555:5555"
    environment:
      - DATABASE_URL=file:/data/agendamento.db
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=https://agendamento.skla.video/api/auth/google/callback
    volumes:
      - sqlite_data:/data

  app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --config /etc/cloudflared/config.yml run
    environment:
      - TUNNEL_CRED_FILE=/etc/cloudflared/tunnel-credentials.json
    volumes:
      - ./cloudflared-config.yml:/etc/cloudflared/config.yml:ro
      - /home/agabo/.cloudflared/6c6ad132-6fc6-422c-8127-194c0adf16d2.json:/etc/cloudflared/tunnel-credentials.json:ro


volumes:
  sqlite_data:
